# Builds the Element Pilot Windows client from this repository: the web app in apps/web is built and bundled
# into apps/desktop, rather than fetching an upstream Element Web release. The installers are not code signed.
# Pushing a pilot/v<version> tag (see `pnpm release:pilot`) also publishes the installers as a GitHub release.
name: Build Windows client
on:
    push:
        branches: [develop]
        tags: ["pilot/v*"]
    workflow_dispatch:
        inputs:
            arch:
                type: choice
                description: "The architecture to build for"
                options: [x64, arm64]
                default: x64
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
env:
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes
    # pnpm on Windows breaks running scripts after switching to the pnpm version a git dependency pins
    PNPM_CONFIG_PM_ON_FAIL: ignore
permissions:
    # Writing is needed to publish the release for a pilot/v<version> tag
    contents: write
jobs:
    build:
        name: Build Windows ${{ inputs.arch || 'x64' }}
        runs-on: windows-2025
        defaults:
            run:
                shell: bash
        env:
            ARCH: ${{ inputs.arch || 'x64' }}
        steps:
            # Tweak line endings to make nx happy, workaround for https://github.com/nrwl/nx/issues/35828
            - name: Configure git line endings
              run: |
                  git config --system core.autocrlf false
                  git config --system core.eol lf

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  node-version-file: apps/desktop/.node-version
                  # Disable cache on Windows as it is slower than not caching
                  # https://github.com/actions/setup-node/issues/975
                  cache: false
                  install: false

            # Ensure the prebuilt seshat binaries for the target architecture get installed when cross-building
            - name: Enable installing optional dependencies for the target architecture
              run: |
                  cat >> pnpm-workspace.yaml <<EOF

                  supportedArchitectures:
                      os: [current]
                      cpu: [current, $ARCH]
                  EOF

            - name: Install dependencies (layered)
              id: layered
              run: |
                  ./scripts/layered.sh

            - name: Work out the Element Pilot version
              id: version
              working-directory: apps/desktop
              run: |
                  echo "version=$(node scripts/pilot-version.ts)" >> $GITHUB_OUTPUT
                  echo "upstream=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

            - name: Build web app
              working-directory: apps/web
              env:
                  CI_PACKAGE: true
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  cp ../desktop/pilot/config.json config.json
                  pnpm run build

            - name: Package web app into webapp.asar
              working-directory: apps/desktop
              run: |
                  rm -rf webapp webapp.asar
                  cp -r ../web/webapp webapp
                  cp pilot/config.json webapp/config.json
                  pnpm run asar-webapp

            - name: Build desktop app
              working-directory: apps/desktop
              env:
                  VARIANT_PATH: pilot/build.json
                  VERSION: ${{ steps.version.outputs.version }}
              run: pnpm run build --publish never --$ARCH -w squirrel msi

            - name: Assert installers are present
              working-directory: apps/desktop
              run: |
                  ls dist/win-*unpacked/Element*.exe
                  ls dist/squirrel-windows*/Element*Setup*.exe
                  ls dist/Element*.msi

            - name: Upload installers
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: element-pilot-win-${{ env.ARCH }}-${{ steps.version.outputs.version }}
                  path: |
                      apps/desktop/dist/squirrel-windows*/Element*Setup*.exe
                      apps/desktop/dist/Element*.msi
                  if-no-files-found: error
                  retention-days: 14

            - name: Publish the release
              if: startsWith(github.ref, 'refs/tags/pilot/v')
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
                  UPSTREAM: ${{ steps.version.outputs.upstream }}
              run: |
                  # Versions with a pre-release label, like 1.3.0-beta.1, are published as pre-releases
                  prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
                  gh release create "$GITHUB_REF_NAME" $prerelease --title "Element Pilot $VERSION" \
                      --notes "Based on Element $UPSTREAM." \
                      apps/desktop/dist/squirrel-windows*/Element*Setup*.exe apps/desktop/dist/Element*.msi
