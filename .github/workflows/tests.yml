name: Tests
on:
    # Pushes to develop don't run the tests; pull requests do
    pull_request: {}
    workflow_dispatch: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

env:
    ENABLE_COVERAGE: true
    # fetchdep.sh needs to know our PR number
    PR_NUMBER: ${{ github.event.pull_request.number }}
    NX_DEFAULT_OUTPUT_STYLE: stream-without-prefixes

permissions:
    contents: read

jobs:
    vitest:
        name: Vitest ${{ format('{0}/{1}', matrix.runner, strategy.job-total) }}
        strategy:
            fail-fast: false
            matrix:
                # Run multiple instances in parallel to speed up the tests
                runner: [1, 2, 3]
        runs-on: ubuntu-26.04
        steps:
            # Dump the disk usage before we start: this job frequently flakes with "No space left on device"
            # so, with the one at the end too, this will let us work out how much disk has been used.
            - name: dfbefore
              run: df -h && df -i

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  cache: true
                  install: false

            - name: Install Deps (layered)
              run: "./scripts/layered.sh"

            - name: Setup playwright
              uses: ./.github/actions/setup-playwright
              with:
                  write-cache: true

            - name: Run tests
              run: pnpm test:unit --coverage=$ENABLE_COVERAGE --shard "$SHARD" --reporter=blob --reporter=github-actions --reporter=dot
              env:
                  SHARD: ${{ format('{0}/{1}', matrix.runner, strategy.job-total) }}

            # Dump the disk usage on failure, because this job seems to fail with disk fills sometimes
            - name: df
              run: df -h && df -i
              if: ${{ failure() }}

            - name: Upload Coverage
              if: env.ENABLE_COVERAGE == 'true'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: coverage-vitest-${{ matrix.runner }}
                  path: |
                      ./coverage
                      !./coverage/lcov-report

            - name: Upload Blob
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: always()
              with:
                  name: vitest-blob-${{ matrix.runner }}
                  overwrite: true # Overwrite any artifacts from previous runs (ie. flakes)
                  include-hidden-files: true
                  path: |
                      ./.vitest

            - name: Upload vis results
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: always()
              with:
                  name: vis-results-${{ matrix.runner }}
                  # Only used for the stale-screenshot check
                  path: packages/shared-components/__vis__/linux/__results__
                  if-no-files-found: ignore

    complete:
        name: Tests
        needs:
            - vitest
        if: always()
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0 # Full history, fastest for diff-cover

            - name: Download coverage artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              if: needs.vitest.result == 'success' && env.ENABLE_COVERAGE == 'true'
              with:
                  pattern: coverage-*
                  path: coverage

            - name: Diff Coverage
              id: coverage
              if: needs.vitest.result == 'success' && env.ENABLE_COVERAGE == 'true'
              uses: Affanmir/diff-cover-action@0c892dd61c33b7bc2de45669677d23ede3e145fa # v2.2.0
              with:
                  compare-branch: origin/${{ github.base_ref || 'develop' }}
                  mode: coverage
                  coverage-files: coverage/*/*lcov.info
                  ignore-whitespace: true
                  show-uncovered: true
                  post-comment: false
                  create-annotations: true
                  annotation-type: warning
                  fail-on-threshold: ${{ contains(github.event.pull_request.labels.*.name, 'Z-Skip-Coverage') && 'false' || 'true' }}
                  fail-under: 80

            - name: Download vitest blobs
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  pattern: vitest-blob-*
                  merge-multiple: true
                  path: .vitest

            - name: Download vis results
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  pattern: vis-results-*
                  merge-multiple: true
                  path: packages/shared-components/__vis__/linux/__results__

            - name: Detect stale screenshots
              working-directory: packages/shared-components/__vis__/linux
              run: |
                  if diff -rq __baselines__ __results__ | grep "^Only in __baselines__"; then
                      exit 1
                  fi

            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              if: always() # Needed for the report merger, next
              with:
                  cache: true
                  install: true
                  require-lockfile: true

            - run: pnpm vitest --merge-reports --reporter=html
              if: always()

            - name: Upload HTML report
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: always()
              with:
                  name: vitest-html-report
                  include-hidden-files: true
                  path: |
                      ./.vitest

            - name: Check status of tests
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
